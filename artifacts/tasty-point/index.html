<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>Tasty Point — Order at Your Table</title>

    <!-- SEO -->
    <meta name="description" content="Order delicious food directly at your table. Browse our menu, add items to your cart, and get fresh meals delivered to you — fast and easy." />
    <meta name="keywords" content="restaurant, food ordering, table order, QR menu, Indian food, dine in" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#c41230" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tasty Point" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tasty Point — Order at Your Table" />
    <meta property="og:description" content="Scan, browse, and order delicious food directly at your table. Fast, fresh and easy." />
    <meta property="og:image" content="/tasty-point/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tasty Point — Order at Your Table" />
    <meta name="twitter:description" content="Scan, browse, and order delicious food directly at your table." />
    <meta name="twitter:image" content="/tasty-point/opengraph.jpg" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
