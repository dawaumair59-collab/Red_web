openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Restaurant QR Ordering API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu categories and items
  - name: tables
    description: Restaurant tables
  - name: orders
    description: Customer orders
  - name: payments
    description: Razorpay payment integration
  - name: uploads
    description: Cloudinary signed uploads
  - name: admin
    description: Admin dashboard operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── CATEGORIES ───────────────────────────────────────────
  /menu/categories:
    get:
      operationId: listCategories
      tags: [menu]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [menu]
      summary: Create a new category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /menu/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [menu]
      summary: Update a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [menu]
      summary: Delete a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Category deleted

  # ── MENU ITEMS ───────────────────────────────────────────
  /menu/items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List menu items, optionally filter by category or availability
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a new menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu/items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a menu item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    patch:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Menu item deleted

  # ── TABLES ───────────────────────────────────────────────
  /tables:
    get:
      operationId: listTables
      tags: [tables]
      summary: List all restaurant tables
      responses:
        "200":
          description: List of tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
    post:
      operationId: createTable
      tags: [tables]
      summary: Create a new table (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "201":
          description: Table created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"

  /tables/{id}:
    delete:
      operationId: deleteTable
      tags: [tables]
      summary: Delete a table (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Table deleted

  # ── ORDERS ───────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders, optionally filter by status or tableId
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, preparing, ready, delivered, cancelled]
        - name: tableId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── PAYMENTS ─────────────────────────────────────────────
  /payments/create-order:
    post:
      operationId: createPaymentOrder
      tags: [payments]
      summary: Create a Razorpay order for an existing restaurant order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderInput"
      responses:
        "200":
          description: Razorpay order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderResponse"

  /payments/verify:
    post:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify Razorpay payment signature and mark order as paid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentInput"
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPaymentResponse"

  # ── UPLOADS ──────────────────────────────────────────────
  /uploads/sign:
    post:
      operationId: getUploadSignature
      tags: [uploads]
      summary: Get a Cloudinary signed upload signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSignatureInput"
      responses:
        "200":
          description: Upload signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSignatureResponse"

  # ── ADMIN ────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [admin]
      summary: Get 10 most recent orders
      responses:
        "200":
          description: Recent orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"

  /admin/auth/verify:
    get:
      operationId: verifyAdminToken
      tags: [admin]
      summary: Verify admin JWT token
      responses:
        "200":
          description: Token valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerifyResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ── CATEGORY ─────────────────────────────────────────
    Category:
      type: object
      required: [id, name, slug, sortOrder, createdAt]
      properties:
        id:        { type: string }
        name:      { type: string }
        slug:      { type: string }
        imageUrl:  { type: ["string", "null"] }
        sortOrder: { type: integer }
        createdAt: { type: string }

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:      { type: string }
        slug:      { type: string }
        imageUrl:  { type: ["string", "null"] }
        sortOrder: { type: integer }

    # ── MENU ITEM ─────────────────────────────────────────
    MenuItem:
      type: object
      required: [id, name, price, categoryId, available, isVeg, isFeatured, createdAt]
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: ["string", "null"] }
        price:       { type: number }
        imageUrl:    { type: ["string", "null"] }
        categoryId:  { type: string }
        available:   { type: boolean }
        isVeg:       { type: boolean }
        isFeatured:  { type: boolean }
        createdAt:   { type: string }

    MenuItemInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:        { type: string }
        description: { type: ["string", "null"] }
        price:       { type: number }
        imageUrl:    { type: ["string", "null"] }
        categoryId:  { type: string }
        available:   { type: boolean }
        isVeg:       { type: boolean }
        isFeatured:  { type: boolean }

    # ── TABLE ─────────────────────────────────────────────
    Table:
      type: object
      required: [id, number, qrCode, createdAt]
      properties:
        id:        { type: string }
        number:    { type: integer }
        qrCode:    { type: string }
        label:     { type: ["string", "null"] }
        createdAt: { type: string }

    TableInput:
      type: object
      required: [number]
      properties:
        number: { type: integer }
        label:  { type: string }

    # ── ORDER ─────────────────────────────────────────────
    OrderItem:
      type: object
      required: [menuItemId, name, price, quantity]
      properties:
        menuItemId: { type: string }
        name:       { type: string }
        price:      { type: number }
        quantity:   { type: integer }
        imageUrl:   { type: ["string", "null"] }

    Order:
      type: object
      required: [id, tableId, tableNumber, status, items, totalAmount, paymentStatus, paymentMethod, createdAt]
      properties:
        id:                { type: string }
        tableId:           { type: string }
        tableNumber:       { type: integer }
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalAmount:       { type: number }
        customerName:      { type: ["string", "null"] }
        specialRequests:   { type: ["string", "null"] }
        paymentStatus:
          type: string
          enum: [unpaid, paid, failed]
        paymentMethod:
          type: string
          enum: [online, cod]
        razorpayOrderId:   { type: ["string", "null"] }
        razorpayPaymentId: { type: ["string", "null"] }
        createdAt:         { type: string }

    OrderInput:
      type: object
      required: [tableId, items]
      properties:
        tableId:
          type: string
        customerName:
          type: string
        specialRequests:
          type: string
        paymentMethod:
          type: string
          enum: [online, cod]
        items:
          type: array
          items:
            type: object
            required: [menuItemId, quantity]
            properties:
              menuItemId: { type: string }
              quantity:   { type: integer, minimum: 1 }

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled]

    # ── PAYMENTS ─────────────────────────────────────────
    CreatePaymentOrderInput:
      type: object
      required: [orderId]
      properties:
        orderId: { type: string }

    PaymentOrderResponse:
      type: object
      required: [razorpayOrderId, amount, currency, keyId]
      properties:
        razorpayOrderId: { type: string }
        amount:          { type: integer }
        currency:        { type: string }
        keyId:           { type: string }

    VerifyPaymentInput:
      type: object
      required: [orderId, razorpayOrderId, razorpayPaymentId, razorpaySignature]
      properties:
        orderId:            { type: string }
        razorpayOrderId:    { type: string }
        razorpayPaymentId:  { type: string }
        razorpaySignature:  { type: string }

    VerifyPaymentResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ── UPLOADS ──────────────────────────────────────────
    UploadSignatureInput:
      type: object
      required: [folder]
      properties:
        folder: { type: string }

    UploadSignatureResponse:
      type: object
      required: [signature, timestamp, cloudName, apiKey]
      properties:
        signature:  { type: string }
        timestamp:  { type: integer }
        cloudName:  { type: string }
        apiKey:     { type: string }

    # ── ADMIN ─────────────────────────────────────────────
    AdminStats:
      type: object
      required: [totalOrders, totalRevenue, pendingOrders, todayOrders, todayRevenue, popularItems, ordersByStatus]
      properties:
        totalOrders:   { type: integer }
        totalRevenue:  { type: number }
        pendingOrders: { type: integer }
        todayOrders:   { type: integer }
        todayRevenue:  { type: number }
        popularItems:
          type: array
          items:
            type: object
            required: [name, count, revenue]
            properties:
              name:    { type: string }
              count:   { type: integer }
              revenue: { type: number }
        ordersByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count:  { type: integer }

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email:    { type: string }
        password: { type: string }

    AdminLoginResponse:
      type: object
      required: [token, email]
      properties:
        token: { type: string }
        email: { type: string }

    AdminVerifyResponse:
      type: object
      required: [email]
      properties:
        email: { type: string }
