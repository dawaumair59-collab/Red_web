openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Restaurant Order Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Customer orders
  - name: admin
    description: Admin dashboard operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── ORDERS ───────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders, optionally filter by status or table number
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, preparing, ready, delivered]
        - name: tableNumber
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── ADMIN DASHBOARD ──────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OrderItem:
      type: object
      required: [menuItemId, name, price, quantity]
      properties:
        menuItemId: { type: string }
        name:       { type: string }
        price:      { type: number }
        quantity:   { type: integer }
        notes:      { type: ["string", "null"] }

    Order:
      type: object
      required: [id, tableNumber, status, items, totalAmount, createdAt]
      properties:
        id:           { type: string }
        tableNumber:  { type: integer }
        status:
          type: string
          enum: [pending, accepted, preparing, ready, delivered]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalAmount:      { type: number }
        customerName:     { type: ["string", "null"] }
        specialRequests:  { type: ["string", "null"] }
        createdAt:        { type: string }
        updatedAt:        { type: string }

    OrderInput:
      type: object
      required: [tableNumber, items]
      properties:
        tableNumber:
          type: integer
        customerName:
          type: string
        specialRequests:
          type: string
        items:
          type: array
          items:
            type: object
            required: [menuItemId, name, price, quantity]
            properties:
              menuItemId: { type: string }
              name:       { type: string }
              price:      { type: number }
              quantity:   { type: integer, minimum: 1 }
              notes:      { type: string }

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, accepted, preparing, ready, delivered]

    AdminStats:
      type: object
      required: [totalOrders, pendingOrders, activeOrders, completedToday, ordersByStatus]
      properties:
        totalOrders:     { type: integer }
        pendingOrders:   { type: integer }
        activeOrders:    { type: integer }
        completedToday:  { type: integer }
        ordersByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count:  { type: integer }
